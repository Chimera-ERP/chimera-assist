name: Android build and release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: assist-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm run quality:check
      - run: npm test
      - name: Android regression and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --max-workers=2 --console=plain
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Require increasing release and Android version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tool/release.mjs plan
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: steps.plan.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK
        if: steps.plan.outputs.publish == 'true'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore persistent signing identity
        if: steps.plan.outputs.publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ASSIST_KEYSTORE_BASE64 }}
        run: |
          umask 077
          python3 - <<'PY'
          import os,base64,pathlib
          key=base64.b64decode(os.environ['KEYSTORE_BASE64'],validate=True)
          if not key: raise SystemExit('Missing signing key')
          pathlib.Path(os.environ['RUNNER_TEMP'],'assist.p12').write_bytes(key)
          PY
      - name: Build signed APK
        if: steps.plan.outputs.publish == 'true'
        env:
          ASSIST_KEYSTORE_PATH: ${{ runner.temp }}/assist.p12
          ASSIST_KEYSTORE_PASSWORD: ${{ secrets.ASSIST_KEYSTORE_PASSWORD }}
          ASSIST_KEY_ALIAS: ${{ secrets.ASSIST_KEY_ALIAS }}
          ASSIST_KEY_PASSWORD: ${{ secrets.ASSIST_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --max-workers=2 --console=plain
      - name: Verify package, version, certificate and manifest
        if: steps.plan.outputs.publish == 'true'
        run: |
          export AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          export APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          node tool/release.mjs package app/build/outputs/apk/release/app-release.apk
      - name: Attest APK build provenance
        if: steps.plan.outputs.publish == 'true'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*.apk
      - name: Preserve verification bundle
        if: steps.plan.outputs.publish == 'true'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" release/assist.apk.sigstore.json
      - name: Publish verified release atomically
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          gh release create "$TAG" release/*.apk release/assist-update.json release/SHA256SUMS release/assist.apk.sigstore.json --draft --target "$GITHUB_SHA" --title "Chimera Assist $TAG" --notes-file release/notes.md
          gh release edit "$TAG" --draft=false --latest
      - name: Remove runner signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/assist.p12"
